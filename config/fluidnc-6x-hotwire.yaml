# =============================================================================
# FluidNC config: 4-axis CNC hot-wire foam cutter (wingcut-fluidnc, variant B: 6x + DM542T)
# Board   : Bart Dring "6x CNC Controller", integrated ESP32 (V1.1/V1.2; same I/O), CP2102 USB-C
# Drivers : 4x StepperOnline DM542T V4.0, external, COMMON-GROUND wiring
#           (6x Stp/Dir/Ena -> PUL+/DIR+/ENA+; 6x port Gnd -> PUL-/DIR-/ENA- jumpered)
#           On EVERY DM542T: S2 = 5V (ships at 24V: motor won't move with 5 V signals)
#           SW1-3 = ON-OFF-ON (1.91 A peak / 1.36 A RMS), SW4 = OFF (50 % standstill current)
#           SW5-8 = ON-ON-OFF-ON (3200 pulses/rev = 1/16; must match steps/mm below)
# Motors  : 4x 17HS19-2004S1 (2.0 A)
# Firmware: written and key-checked against FluidNC v4.1.1 source (tag v4.1.1).
#           Install v4.1.1 or later with installer.fluidnc.com; never v4.0.4 (marked BAD).
#
# PIN MAP (6x wiki http://wiki.fluidnc.com/en/hardware/official/6x_CNC_Controller + its pinout image).
# Motor ports are labelled Ena / Stp / Dir / Gnd, left to right.
#
#   wingcut axis    6x port   step      dir       disable(Ena)  limit input (terminal)
#   X root chord    Motor1    i2so.2    i2so.1    i2so.0        io.33  (X min, FRONT)
#   Y root vert     Motor2    i2so.5    i2so.4    i2so.7        io.32  (Y max, TOP)
#   Z tip chord     Motor3    i2so.10   i2so.9    i2so.8        io.35  (Z min, FRONT)
#   A tip vert      Motor4    i2so.13   i2so.12   i2so.15       io.34  (A max, TOP)
#   I2SO: BCK gpio.22, DATA gpio.21, WS gpio.17
#   E-stop NC3 : input io.39 + Gnd
#   Hot wire   : MOSFET block TB5 "VMot" -> SSR 3(+);  TB5 "io.4" -> SSR 4(-)
#   Leave empty: inputs io.2/io.26 (no pull-up) and io.36, MOSFET io.12, ALL "Outputs (5v)"
#                terminals, Motor5/6, RS485, 0-10V, module socket.
#
# INPUTS: opto-isolated. Closing a terminal to its Gnd lights the opto LED (5 V -> 300 R, ~12 mA)
# and pulls the ESP32 pin LOW; the pin side has a 10k pull-up (all but gpio.2/26). Wiki: "Normally
# closed are active high ... not needed because that is default". Gold switches are wired NC to Gnd:
# closed = low = OK; open (switch hit OR broken wire) = high = triggered. Fail-safe, no attribute.
# Do NOT add :pu (gpio.32-39 already have the external one; 34-39 have no internal one anyway).
# Do NOT add :low (that would invert the fail-safe).
#
# Do not wire anything to the io.4 / io.12 "Outputs (5v)" terminals: they switch together with the
# MOSFETs. gpio.12 is an ESP32 boot-strapping pin; pulling it high stops the board booting.
# =============================================================================

board: 6x CNC Controller
name: wingcut-fluidnc hot wire (6x + DM542T)
meta: wingcut-fluidnc variant B, wingcut axes X Y Z A = root-x root-y tip-x tip-y

stepping:
  engine: I2S_STATIC        # all 6x motor outputs are on the I2S shift registers (wiki)
  idle_ms: 255              # 255 = never auto-disable: holds position between cuts (also in Alarm)
  pulse_us: 6               # DM542T: PUL >= 2.5 us high and low. I2S rounds up to whole frames.
                            #   Max ~1e6/(2*6+6) = 55 k steps/s (v4.1.1 Stepping.cpp); need 24 k
  dir_delay_us: 6           # DM542T: DIR must lead PUL by >= 5 us
  disable_delay_us: 200000  # DM542T: "Enable time ... at least 200ms". Waited only on an
                            #   enable transition ($ME, boot); motors stay enabled otherwise
  segments: 12              # default; feed-hold latency ~ 10 ms x segments

i2so:
  bck_pin: gpio.22
  data_pin: gpio.21
  ws_pin: gpio.17

spi:
  miso_pin: gpio.19
  mosi_pin: gpio.23
  sck_pin: gpio.18

sdcard:
  cs_pin: gpio.5
  card_detect_pin: NO_PIN

start:
  must_home: true           # boots in alarm until $H, so soft limits always mean something
  check_limits: true        # a switch open at boot (parked on it, or broken wire) -> alarm

verbose_errors: true

axes:
  shared_stepper_disable_pin: NO_PIN
  homing_runs: 2

  # ---------------- X = ROOT tower chord. GT2 20T: 200 x 16 / 40 = 80 steps/mm -------------
  x:
    steps_per_mm: 80.000
    max_rate_mm_per_min: 1500.000
    acceleration_mm_per_sec2: 200.000
    max_travel_mm: 1000.000
    soft_limits: true
    homing:
      cycle: 2                  # after the verticals (cycle 1) have lifted the wire clear
      positive_direction: false # switch at the FRONT (min) end
      mpos_mm: 0.000            # X0 = front, 3 mm off the switch after pull-off; +X = away from you
      feed_mm_per_min: 100.000
      seek_mm_per_min: 1000.000
      settle_ms: 250
      seek_scaler: 1.100
      feed_scaler: 1.100
    motor0:
      limit_neg_pin: gpio.33
      hard_limits: true
      pulloff_mm: 3.000
      standard_stepper:         # Motor1 port -> DM542T #1
        step_pin: i2so.2
        direction_pin: i2so.1   # jogs the wrong way? -> i2so.1:low
        disable_pin: i2so.0     # DM542T: ENA+ high = DISABLED -> active-high, no :low

  # ---------------- Y = ROOT tower vertical. T8x2 single start: 3200 / 2 = 1600 steps/mm -----
  y:
    steps_per_mm: 1600.000
    max_rate_mm_per_min: 900.000      # 7.5 rev/s, 24 k steps/s; drop to 600 if it stalls
    acceleration_mm_per_sec2: 100.000
    max_travel_mm: 290.000            # PLACEHOLDER, measure before relying on hard limits:
                                      #   = mpos_mm - (lowest safe tip height above bed + 2)
    soft_limits: true
    homing:
      cycle: 1                  # verticals first, together: lift the cold wire clear of the foam
      positive_direction: true  # switch at the TOP (max) end
      mpos_mm: 300.000          # PLACEHOLDER, measure: wire-contact height above the BED TOP at home
                                #   (Y0 = bed top). Soft range becomes [mpos - max_travel, mpos].
      feed_mm_per_min: 60.000
      seek_mm_per_min: 600.000
      settle_ms: 250
      seek_scaler: 1.100
      feed_scaler: 1.100
    motor0:
      limit_pos_pin: gpio.32
      hard_limits: true
      pulloff_mm: 2.000
      standard_stepper:         # Motor2 port -> DM542T #2
        step_pin: i2so.5
        direction_pin: i2so.4
        disable_pin: i2so.7

  # ---------------- Z = TIP tower chord (same as X) ----------------------------------------
  z:
    steps_per_mm: 80.000
    max_rate_mm_per_min: 1500.000
    acceleration_mm_per_sec2: 200.000
    max_travel_mm: 1000.000
    soft_limits: true
    homing:
      cycle: 2
      positive_direction: false
      mpos_mm: 0.000            # TRAM: set to the measured X-vs-Z offset so that X = Z means the
                                #   wire is square to the bed in plan (02 doc, "Tram")
      feed_mm_per_min: 100.000
      seek_mm_per_min: 1000.000
      settle_ms: 250
      seek_scaler: 1.100
      feed_scaler: 1.100
    motor0:
      limit_neg_pin: gpio.35
      hard_limits: true
      pulloff_mm: 3.000
      standard_stepper:         # Motor3 port -> DM542T #3
        step_pin: i2so.10
        direction_pin: i2so.9
        disable_pin: i2so.8

  # ---------------- A = TIP tower vertical (same as Y). Linear mm, like every FluidNC axis ----
  a:
    steps_per_mm: 1600.000
    max_rate_mm_per_min: 900.000
    acceleration_mm_per_sec2: 100.000
    max_travel_mm: 290.000            # PLACEHOLDER, as for Y
    soft_limits: true
    homing:
      cycle: 1
      positive_direction: true
      mpos_mm: 300.000          # PLACEHOLDER, measure as for Y (tram: Y and A heights must agree)
      feed_mm_per_min: 60.000
      seek_mm_per_min: 600.000
      settle_ms: 250
      seek_scaler: 1.100
      feed_scaler: 1.100
    motor0:
      limit_pos_pin: gpio.34
      hard_limits: true
      pulloff_mm: 2.000
      standard_stepper:         # Motor4 port -> DM542T #4
        step_pin: i2so.13
        direction_pin: i2so.12
        disable_pin: i2so.15

control:
  # Third NC contact of the E-stop -> input io.39 + Gnd (+100 nF). Closed = low = OK.
  # Pressed (or broken wire) = active -> hard stop, wire off via off_on_alarm, critical alarm that
  # only a soft reset clears. On the 6x the E-stop also kills the board (ESP32 and CP2102 run from
  # VMot only), so this mainly covers the PSU hold-up time and a 24 V supply that doesn't drop.
  estop_pin: gpio.39
# No probe: (the 6x default config puts its probe on gpio.39/36: none here on purpose),
# no coolant:, parking (parking.enable defaults to false). Inputs io.36, io.2, io.26 stay unused.

# ---------------- Hot wire = PWM "spindle" on MOSFET io.4 -> isolated DC SSR -----------------
# PWM spindles are not "rate adjusted", so heat stays constant through G0/G1/G4 (laser mode $32 = 0).
# wingcut Pause: feed hold, then 0x9E (spindle stop) once in Hold:0. FluidNC v4.1.1 Protocol.cpp
# turns the PWM off (spinDown); Resume (~) restores M3 S<n>, waits spinup_ms x S/1000, then moves.
# Nothing extra to configure.
PWM:
  pwm_hz: 100               # DC60 t_on <=0.1 ms / t_off <=0.3 ms -> <=4 % duty error at 100 Hz
  output_pin: gpio.4        # MOSFET terminal io.4 (NOT the io.4 5 V output)
  enable_pin: NO_PIN        # no relay in this design; MOSFET io.12 stays empty
  direction_pin: NO_PIN
  disable_with_s0: false
  s0_with_disable: true     # M5 forces duty 0
  spinup_ms: 3000           # reheat time before motion (3 s at S1000; Riden standard, always S1000)
  spindown_ms: 0
  tool_num: 0
  speed_map: 0=0% 1000=100% # S0..S1000 = 0..100 % duty. S1000 = DC (Riden option)
  off_on_alarm: true        # wire off on any alarm (hard limit, homing fail, E-stop, ...)
